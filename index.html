<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteka gier</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');

        :root {
            --bg: #141418;
            --glass: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --text-dim: #a1a1aa;
            --ps-brand: #00439c;
            --xbox-brand: #107c10;
            --pc-brand: #333;
            --bezier: cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

        /* SKALOWANIE 2K/4K */
        html { font-size: 16px; } 
        @media (min-width: 2000px) { html { font-size: 18px; } }
        @media (min-width: 2500px) { html { font-size: 21px; } }
        @media (min-width: 3800px) { html { font-size: 24px; } }

        /* DOPASOWANIE POD TELEFON */
        @media (max-width: 768px) {
            body { padding: 1rem !important; }
            .top-bar { 
                flex-direction: column !important; 
                padding: 1rem !important; 
                gap: 1rem !important;
                height: auto !important;
            }
            .top-bar.scrolled { padding: 0.8rem 1rem !important; }
            .logo { width: 100%; justify-content: center; font-size: 1.2rem; }
            .header-stats { display: none; }
            .search-container { width: 100%; max-width: none; }
            .tools-container { width: 100%; justify-content: space-between; gap: 0.5rem; }
            .tool-btn { flex: 1; justify-content: center; height: 3rem; font-size: 0.8rem; padding: 0.5rem; }
            .main-content { padding-top: 14rem !important; }
            .gallery-nav, .card-overlay { opacity: 1 !important; }
            .modal-content { width: 95%; padding: 1.5rem; border-radius: 1.5rem; }
            .platform-btn { padding: 0.8rem 1rem; font-size: 0.9rem; }
        }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(59, 130, 246, 0.1), transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(124, 58, 237, 0.08), transparent 40%);
            color: #fff;
            min-height: 100vh;
            padding: 2rem 4rem;
            -webkit-font-smoothing: antialiased;
        }

        @keyframes cardEnter {
            from { opacity: 0; transform: translateY(15px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .card-exit-anim {
            opacity: 0 !important;
            transform: scale(0.9) !important;
            transition: 0.3s var(--bezier) !important;
        }

        #platformModal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(20px);
            z-index: 10000;
            align-items: center; justify-content: center;
        }
        .modal-content {
            background: #111;
            border: 1px solid var(--glass-border);
            padding: 3rem; border-radius: 2.5rem;
            max-width: 500px; width: 90%; text-align: center;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }
        .platform-list { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; margin: 2rem 0; }
        
        .platform-btn {
            background: #222;
            border: 1px solid var(--glass-border);
            color: white; padding: 1rem 2rem; border-radius: 1.2rem;
            cursor: pointer; transition: 0.3s var(--bezier); font-weight: 800;
        }
        .btn-ps:hover { background: var(--ps-brand) !important; border-color: white; box-shadow: 0 0 25px rgba(0, 67, 156, 0.6); }
        .btn-xbox:hover { background: var(--xbox-brand) !important; border-color: white; box-shadow: 0 0 25px rgba(16, 124, 16, 0.6); }
        .btn-pc:hover { background: #444 !important; border-color: white; box-shadow: 0 0 25px rgba(255, 255, 255, 0.15); }

        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            position: fixed; top: 0; left: 0; width: 100%; z-index: 2000;
            padding: 2rem 4rem; 
            gap: 2rem; 
            background: rgba(20, 20, 24, 0.82);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid transparent;
            transition: all 0.3s var(--bezier);
        }
        .top-bar.scrolled {
            padding: 1rem 4rem;
            border-bottom: 1px solid var(--glass-border);
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }
        
        .logo { font-size: 1.5rem; font-weight: 800; display: flex; align-items: center; gap: 1rem; letter-spacing: -1px; white-space: nowrap; }
        
        .header-stats {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-dim);
            background: rgba(255, 255, 255, 0.05);
            padding: 0.4rem 0.8rem;
            border-radius: 1rem;
            margin-left: 0.5rem;
            border: 1px solid var(--glass-border);
            letter-spacing: normal;
        }
        .header-stats span { color: #fff; }

        .search-container { flex-grow: 1; max-width: 600px; position: relative; }
        .search-box {
            background: rgba(255, 255, 255, 0.05); border: 1px solid var(--glass-border); border-radius: 1.3rem;
            position: relative; display: flex; align-items: center;
        }
        .search-input { width: 100%; padding: 1.1rem 1.5rem; background: transparent; border: none; color: white; outline: none; font-size: 1rem; }
        .search-loader { position: absolute; right: 1.2rem; color: var(--text-dim); font-size: 1.1rem; display: none; }

        .tools-container { display: flex; align-items: center; gap: 1rem; }
        .tool-btn {
            background: rgba(255, 255, 255, 0.06); border: 1px solid var(--glass-border);
            color: white; padding: 0.8rem; border-radius: 1.1rem;
            cursor: pointer; transition: 0.3s; height: 3.4rem;
            display: flex; align-items: center; justify-content: center;
        }
        .tool-btn:hover { background: rgba(255, 255, 255, 0.12); border-color: white; }
        select.tool-btn option { background: #111; color: #fff; }

        .main-content {
            padding-top: 8rem;
        }

        .game-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2rem; margin-bottom: 5rem; width: 100%; }
        @media (min-width: 2500px) { .game-grid { grid-template-columns: repeat(6, 1fr); } }
        @media (max-width: 1600px) { .game-grid { grid-template-columns: repeat(4, 1fr); } }
        @media (max-width: 1200px) { .game-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 800px) { .game-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 500px) { .game-grid { grid-template-columns: 1fr; } }

        .game-card {
            background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border-radius: 1.8rem;
            overflow: hidden; border: 1px solid var(--glass-border);
            transition: transform 0.4s var(--bezier), border-color 0.4s, box-shadow 0.4s;
            animation: cardEnter 0.5s var(--bezier) backwards;
            backface-visibility: hidden; transform: translateZ(0);
        }
        .img-box { width: 100%; aspect-ratio: 16 / 9; overflow: hidden; position: relative; background: #000; }
        .img-box img { width: 100%; height: 101%; object-fit: cover; transition: 0.8s var(--bezier); backface-visibility: hidden; }
        .game-card:hover { transform: translateY(-10px) translateZ(0); border-color: rgba(255,255,255,0.4); box-shadow: 0 30px 60px rgba(0,0,0,0.7); }
        .game-card:hover img { transform: scale(1.1) translateZ(0); }

        .nav-arrow, .action-btn {
            width: 2rem; height: 2rem; border-radius: 50%;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.15);
            color: white; cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: 0.3s var(--bezier); z-index: 5; font-size: 0.85rem;
        }
        .nav-arrow:hover, .action-btn:hover { background: rgba(255, 255, 255, 0.2); border-color: rgba(255, 255, 255, 0.8); transform: scale(1.1); }

        .gallery-nav { position: absolute; top: 50%; width: 100%; display: flex; justify-content: space-between; padding: 0 0.8rem; transform: translateY(-50%); opacity: 0; transition: 0.3s; }
        .game-card:hover .gallery-nav { opacity: 1; }
        .card-overlay { position: absolute; bottom: 0.8rem; right: 0.8rem; display: flex; gap: 0.5rem; opacity: 0; transition: 0.3s; }
        .game-card:hover .card-overlay { opacity: 1; }

        .game-info { padding: 1.6rem; }
        .game-title { font-size: 1.15rem; font-weight: 800; margin-bottom: 0.6rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .platform-badge { font-size: 0.7rem; padding: 0.4rem 1rem; border-radius: 0.7rem; font-weight: 800; text-transform: uppercase; color: white; display: inline-block; margin-bottom: 0.7rem; }
        .badge-ps { background: var(--ps-brand); }
        .badge-xbox { background: var(--xbox-brand); }
        .badge-pc { background: #444; }
        .rating-row { color: #ffb800; font-size: 0.9rem; font-weight: 700; display: flex; align-items: center; gap: 0.5rem; }

        .note-input {
            width: 100%;
            margin-top: 0.8rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid transparent;
            border-bottom: 1px solid var(--glass-border);
            color: var(--text-dim);
            padding: 0.5rem;
            font-size: 0.85rem;
            border-radius: 0.4rem 0.4rem 0 0;
            transition: 0.3s var(--bezier);
            outline: none;
        }
        .note-input:focus {
            background: rgba(255, 255, 255, 0.08);
            border-bottom-color: #fff;
            color: #fff;
        }

        .section-header { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 3px; color: var(--text-dim); margin: 0 0 2rem; display: flex; align-items: center; gap: 1.5rem; }
        .section-header::after { content: ""; height: 1px; flex: 1; background: var(--glass-border); }

        .suggestions {
            position: absolute; top: 5rem; left: 0; width: 100%;
            background: #111; border-radius: 1.5rem; overflow: hidden; display: none;
            flex-direction: column; border: 1px solid var(--glass-border);
            box-shadow: 0 40px 80px rgba(0,0,0,0.9);
        }
        .sugg-item { display: flex; align-items: center; gap: 1.2rem; padding: 1.2rem; cursor: pointer; border-bottom: 1px solid var(--glass-border); }
        .sugg-item:hover { background: rgba(255,255,255,0.05); }
        .sugg-item img { width: 5.5rem; aspect-ratio: 16/9; border-radius: 0.7rem; object-fit: cover; }
        .sugg-empty { padding: 1.2rem; color: var(--text-dim); text-align: center; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div id="platformModal">
        <div class="modal-content">
            <h2 id="modalGameName" style="margin-bottom: 1rem;">Wybierz platformę</h2>
            <div id="platformList" class="platform-list"></div>
            <button onclick="closeModal()" style="background:none; border:none; color:var(--text-dim); cursor:pointer; font-weight:700; margin-top:1rem;">Anuluj</button>
        </div>
    </div>

    <div class="top-bar">
        <div class="logo">
            <i class="fa-solid fa-gamepad"></i> BIBLIOTEKA GIER
            <div class="header-stats">
                <span id="statToPlay">0</span> w kolejce &nbsp;|&nbsp; <span id="statDone">0</span> ukończonych
            </div>
        </div>
        <div class="search-container">
            <div class="search-box">
                <input type="text" id="searchInput" class="search-input" placeholder="Wyszukaj grę..." autocomplete="off">
                <i class="fa-solid fa-circle-notch fa-spin search-loader" id="searchLoader"></i>
            </div>
            <div id="suggestions" class="suggestions"></div>
        </div>
        <div class="tools-container">
            <select id="sortFilter" class="tool-btn" onchange="render(true)">
                <option value="added">Najnowsze (domyślnie)</option>
                <option value="az">Alfabetycznie A-Z</option>
                <option value="za">Alfabetycznie Z-A</option>
            </select>
            <select id="platformFilter" class="tool-btn" onchange="render(true)">
                <option value="all">Wszystkie platformy</option>
                <option value="PlayStation">PlayStation</option>
                <option value="Xbox">Xbox</option>
                <option value="PC">PC</option>
            </select>
            <button class="tool-btn" onclick="exportData()"><i class="fa-solid fa-download"></i></button>
            <label class="tool-btn">
                <i class="fa-solid fa-upload"></i>
                <input type="file" id="importInput" style="display:none;" onchange="importData(event)">
            </label>
        </div>
    </div>

    <div class="main-content">
        <div class="section-header">Twoja Kolejka</div>
        <div id="toPlayGrid" class="game-grid"></div>
        <div class="section-header" style="margin-top: 4rem;">Ukończone Gry</div>
        <div id="completedGrid" class="game-grid"></div>
    </div>

    <script>
        if (history.scrollRestoration) {
            history.scrollRestoration = 'manual';
        }
        window.scrollTo(0, 0);

        window.addEventListener('scroll', () => {
            const topBar = document.querySelector('.top-bar');
            if (window.scrollY > 20) {
                topBar.classList.add('scrolled');
            } else {
                topBar.classList.remove('scrolled');
            }
        });

        const API_KEY = 'f2039f26b654490688e104244980714c';
        
        let state = JSON.parse(localStorage.getItem('gt_v8_liquid')) || { toPlay: [], completed: [] };
        
        state.toPlay.forEach(g => g.currentShotIdx = 0);
        state.completed.forEach(g => g.currentShotIdx = 0);

        let currentSearchData = [];
        let pendingGame = null;
        let debounceTimer;
        
        const saveOnly = () => localStorage.setItem('gt_v8_liquid', JSON.stringify(state));
        const optimizeImg = (url) => url ? url.replace('/media/', '/media/resize/1280/-/') : 'https://via.placeholder.com/1280x720';

        const searchInput = document.getElementById('searchInput');
        const suggBox = document.getElementById('suggestions');
        const loader = document.getElementById('searchLoader');

        searchInput.addEventListener('input', (e) => {
            const val = e.target.value.trim();
            if (val.length < 2) { 
                suggBox.style.display = 'none'; 
                loader.style.display = 'none';
                return; 
            }
            
            loader.style.display = 'block';
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(async () => {
                try {
                    const res = await fetch(`https://api.rawg.io/api/games?key=${API_KEY}&search=${encodeURIComponent(val)}&page_size=6`);
                    const data = await res.json();
                    currentSearchData = data.results || [];
                    
                    if (currentSearchData.length === 0) {
                        suggBox.innerHTML = `<div class="sugg-empty">Brak wyników wyszukiwania</div>`;
                    } else {
                        suggBox.innerHTML = currentSearchData.map((g, i) => {
                            const releaseYear = g.released ? g.released.split('-')[0] : 'b.d.';
                            return `
                            <div class="sugg-item" onclick="openPlatformModal(${i})">
                                <img src="${optimizeImg(g.background_image)}">
                                <div>
                                    <div style="font-weight:800; font-size:1.1rem;">${g.name}</div>
                                    <div style="font-size:0.9rem; color:var(--text-dim); margin-top:0.2rem;">${releaseYear}</div>
                                </div>
                            </div>`;
                        }).join('');
                    }
                    suggBox.style.display = 'flex';
                } catch (err) { 
                    console.error(err); 
                    suggBox.innerHTML = `<div class="sugg-empty">Błąd pobierania danych</div>`;
                    suggBox.style.display = 'flex';
                } finally { 
                    loader.style.display = 'none'; 
                }
            }, 300);
        });

        window.openPlatformModal = function(index) {
            const game = currentSearchData[index];
            if (!game) return;
            pendingGame = game;
            document.getElementById('modalGameName').innerText = game.name;
            const pList = document.getElementById('platformList');
            const allowed = ["PC", "PlayStation 5", "PlayStation 4", "Xbox One", "Xbox Series S/X"];
            let platforms = game.platforms ? game.platforms.map(p => p.platform.name).filter(n => allowed.includes(n)) : ["PC"];
            if(platforms.length === 0) platforms = ["PC"];
            pList.innerHTML = [...new Set(platforms)].map(p => {
                let hCls = 'btn-pc';
                if (p.toLowerCase().includes('playstation')) hCls = 'btn-ps';
                if (p.toLowerCase().includes('xbox')) hCls = 'btn-xbox';
                return `<button class="platform-btn ${hCls}" onclick="confirmAdd('${p}')">${p}</button>`;
            }).join('');
            document.getElementById('platformModal').style.display = 'flex';
            suggBox.style.display = 'none';
        }

        window.closeModal = () => document.getElementById('platformModal').style.display = 'none';

        window.confirmAdd = (platform) => {
            if (!pendingGame) return;
            let shots = [pendingGame.background_image];
            if (pendingGame.short_screenshots?.length > 0) shots = pendingGame.short_screenshots.map(s => s.image);
            
            state.toPlay.push({ 
                id: Math.random().toString(36).substring(2, 11), 
                name: pendingGame.name, 
                screenshots: shots, 
                currentShotIdx: 0, 
                platform: platform, 
                rating: pendingGame.rating,
                note: "" 
            });
            saveOnly(); render(true); closeModal(); searchInput.value = '';
        }

        window.changeImg = (gameId, listType, dir, e) => {
            e.stopPropagation();
            const game = state[listType].find(g => g.id === gameId);
            if (game) {
                game.currentShotIdx = (game.currentShotIdx + dir + game.screenshots.length) % game.screenshots.length;
                e.target.closest('.img-box').querySelector('.main-img').src = optimizeImg(game.screenshots[game.currentShotIdx]);
                saveOnly();
            }
        };

        const moveLogic = (id, from, to, e) => {
            const card = e.target.closest('.game-card');
            card.classList.add('card-exit-anim');
            setTimeout(() => {
                const idx = state[from].findIndex(g => g.id === id);
                if(idx !== -1) { state[to].push(state[from].splice(idx, 1)[0]); saveOnly(); render(); }
            }, 300);
        };

        window.moveToDone = (id, e) => moveLogic(id, 'toPlay', 'completed', e);
        window.moveToToPlay = (id, e) => moveLogic(id, 'completed', 'toPlay', e);
        window.removeGame = (id, list, e) => {
            e.target.closest('.game-card').classList.add('card-exit-anim');
            setTimeout(() => { state[list] = state[list].filter(g => g.id !== id); saveOnly(); render(); }, 300);
        };

        window.saveGameNote = (id, list, inputEl) => {
            const game = state[list].find(g => g.id === id);
            if(game) {
                game.note = inputEl.value;
                saveOnly();
            }
        };

        function renderGrid(elementId, list, type, withAnim) {
            const platformFilter = document.getElementById('platformFilter').value;
            const sortMode = document.getElementById('sortFilter').value;
            
            let filtered = list.filter(g => platformFilter === 'all' || g.platform.includes(platformFilter));
            
            if (sortMode === 'az') {
                filtered.sort((a, b) => a.name.localeCompare(b.name));
            } else if (sortMode === 'za') {
                filtered.sort((a, b) => b.name.localeCompare(a.name));
            }

            const container = document.getElementById(elementId);
            container.innerHTML = filtered.map(g => {
                const pCls = g.platform.includes('PlayStation') ? 'badge-ps' : (g.platform.includes('Xbox') ? 'badge-xbox' : 'badge-pc');
                return `
                <div class="game-card" style="${withAnim ? '' : 'animation:none;'}">
                    <div class="img-box">
                        <img src="${optimizeImg(g.screenshots[g.currentShotIdx])}" class="main-img">
                        <div class="gallery-nav">
                            <button class="nav-arrow" onclick="changeImg('${g.id}', '${type}', -1, event)"><i class="fa-solid fa-chevron-left"></i></button>
                            <button class="nav-arrow" onclick="changeImg('${g.id}', '${type}', 1, event)"><i class="fa-solid fa-chevron-right"></i></button>
                        </div>
                        <div class="card-overlay">
                            ${type === 'toPlay' ? `<button class="action-btn" onclick="moveToDone('${g.id}', event)"><i class="fa-solid fa-check" style="color:#10b981"></i></button>` : `<button class="action-btn" onclick="moveToToPlay('${g.id}', event)"><i class="fa-solid fa-rotate-left"></i></button>`}
                            <button class="action-btn" onclick="removeGame('${g.id}', '${type}', event)"><i class="fa-solid fa-trash-can" style="color:#ef4444"></i></button>
                        </div>
                    </div>
                    <div class="game-info">
                        <div class="platform-badge ${pCls}">${g.platform}</div>
                        <div class="game-title">${g.name}</div>                        
                        <input type="text" class="note-input" placeholder="Notatka..." value="${g.note || ''}" onchange="saveGameNote('${g.id}', '${type}', this)">
                    </div>
                </div>`;
            }).join('');
        }

        function render(withAnim = false) { 
            document.getElementById('statToPlay').innerText = state.toPlay.length;
            document.getElementById('statDone').innerText = state.completed.length;

            renderGrid('toPlayGrid', state.toPlay, 'toPlay', withAnim); 
            renderGrid('completedGrid', state.completed, 'completed', withAnim); 
        }

        window.exportData = () => { const blob = new Blob([JSON.stringify(state)], {type: "application/json"}); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = "biblioteka.json"; a.click(); };
        window.importData = (e) => { const reader = new FileReader(); reader.onload = (ev) => { state = JSON.parse(ev.target.result); saveOnly(); render(true); }; reader.readAsText(e.target.files[0]); };
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
                suggBox.style.display = 'none';
            }
        });

        window.onclick = (e) => { if (!e.target.closest('.search-container')) suggBox.style.display = 'none'; };
        render(true);
    </script>
</body>
</html>
