<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteka gier</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');

        :root {
            --bg: #141418;
            --glass: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --text-dim: #a1a1aa;
            --ps-brand: #00439c;
            --xbox-brand: #107c10;
            --pc-brand: #333;
            --bezier: cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

        html { font-size: 16px; } 
        @media (min-width: 2500px) { html { font-size: 20px; } }

        @media (max-width: 768px) {
            body { padding: 1rem !important; }
            .top-bar { 
                flex-direction: column !important; 
                padding: 1rem !important; 
                gap: 1rem !important;
                height: auto !important;
            }
            .top-bar.scrolled { padding: 0.8rem 1rem !important; }
            .logo { width: 100%; justify-content: center; font-size: 1.2rem; }
            .header-stats { display: none; }
            .search-container { width: 100%; max-width: none; }
            .tools-container { width: 100%; justify-content: space-between; gap: 0.5rem; }
            .tool-btn { flex: 1; justify-content: center; height: 3rem; font-size: 0.8rem; padding: 0.5rem; }
            .main-content { padding-top: 14rem !important; }
            .card-overlay { opacity: 1 !important; }
            .modal-content { width: 95%; padding: 1.5rem; border-radius: 1.5rem; }
            .platform-btn { padding: 0.8rem 1rem; font-size: 0.9rem; }
        }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(59, 130, 246, 0.1), transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(124, 58, 237, 0.08), transparent 40%);
            color: #fff;
            min-height: 100vh;
            padding: 2rem 4rem;
            -webkit-font-smoothing: antialiased;
        }

        /* Animacja wejścia gier */
        @keyframes staggeredCardEntrance {
            from {
                opacity: 0;
                transform: translateY(25px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Modale */
        #platformModal, #deleteModal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(20px);
            z-index: 10000;
            align-items: center; justify-content: center;
        }
        .modal-content {
            background: #111;
            border: 1px solid var(--glass-border);
            padding: 2.5rem 3rem; border-radius: 2.5rem;
            max-width: 480px; width: 90%; text-align: center;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }
        .platform-list { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; margin: 2rem 0; }
        
        .platform-btn {
            background: #222;
            border: 1px solid var(--glass-border);
            color: white; padding: 1rem 2rem; border-radius: 1.2rem;
            cursor: pointer; transition: 0.3s var(--bezier); font-weight: 800;
        }
        .btn-ps:hover { background: var(--ps-brand) !important; border-color: white; box-shadow: 0 0 25px rgba(0, 67, 156, 0.6); }
        .btn-xbox:hover { background: var(--xbox-brand) !important; border-color: white; box-shadow: 0 0 25px rgba(16, 124, 16, 0.6); }
        .btn-pc:hover { background: #444 !important; border-color: white; box-shadow: 0 0 25px rgba(255, 255, 255, 0.15); }

        .btn-confirm-yes {
            background: #ef4444 !important;
            border-color: #ef4444 !important;
            color: #fff;
        }
        .btn-confirm-yes:hover {
            background: #dc2626 !important;
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.6);
        }

        .btn-confirm-no {
            background: #10b981 !important;
            border-color: #10b981 !important;
            color: #fff;
        }
        .btn-confirm-no:hover {
            background: #059669 !important;
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.6);
        }

        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            position: fixed; top: 0; left: 0; width: 100%; z-index: 2000;
            padding: 2rem 4rem; 
            gap: 2rem; 
            background: rgba(20, 20, 24, 0.82);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid transparent;
            transition: all 0.3s var(--bezier);
        }
        .top-bar.scrolled {
            padding: 1rem 4rem;
            border-bottom: 1px solid var(--glass-border);
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }
        
        .logo { font-size: 1.5rem; font-weight: 800; display: flex; align-items: center; gap: 1rem; letter-spacing: -1px; white-space: nowrap; }
        
        .header-stats {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-dim);
            background: rgba(255, 255, 255, 0.05);
            padding: 0.4rem 0.8rem;
            border-radius: 1rem;
            margin-left: 0.5rem;
            border: 1px solid var(--glass-border);
            letter-spacing: normal;
        }
        .header-stats span { color: #fff; }

        .search-container { flex-grow: 1; max-width: 600px; position: relative; }
        .search-box {
            background: rgba(255, 255, 255, 0.05); border: 1px solid var(--glass-border); border-radius: 1.3rem;
            position: relative; display: flex; align-items: center;
        }
        .search-input { width: 100%; padding: 1.1rem 1.5rem; background: transparent; border: none; color: white; outline: none; font-size: 1rem; }
        .search-loader { position: absolute; right: 1.2rem; color: var(--text-dim); font-size: 1.1rem; display: none; }

        .tools-container { display: flex; align-items: center; gap: 1rem; }
        
        .tooltip-wrap { position: relative; display: inline-flex; }
        .tooltip-wrap::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: -2.2rem;
            left: 50%;
            transform: translateX(-50%) translateY(5px);
            background: #111;
            color: #fff;
            padding: 0.3rem 0.6rem;
            font-size: 0.7rem;
            border-radius: 0.4rem;
            white-space: nowrap;
            border: 1px solid var(--glass-border);
            opacity: 0;
            visibility: hidden;
            transition: 0.2s var(--bezier);
            pointer-events: none;
            z-index: 3000;
        }
        .tooltip-wrap:hover::after { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }

        .tool-btn {
            background: rgba(255, 255, 255, 0.06); border: 1px solid var(--glass-border);
            color: white; padding: 0.8rem; border-radius: 1.1rem;
            cursor: pointer; transition: 0.3s; height: 3.4rem;
            display: flex; align-items: center; justify-content: center;
        }
        .tool-btn:hover { background: rgba(255, 255, 255, 0.12); border-color: white; }
        select.tool-btn option { background: #111; color: #fff; }

        .main-content {
            padding-top: 8rem;
        }

        .game-grid { 
            display: grid; 
            grid-template-columns: repeat(7, 1fr); 
            gap: 1.2rem; 
            margin-bottom: 5rem; 
            width: 100%; 
            min-height: 50px;
        }
        @media (min-width: 2000px) { .game-grid { grid-template-columns: repeat(8, 1fr); } }
        @media (max-width: 1600px) { .game-grid { grid-template-columns: repeat(6, 1fr); } }
        @media (max-width: 1300px) { .game-grid { grid-template-columns: repeat(5, 1fr); } }
        @media (max-width: 1000px) { .game-grid { grid-template-columns: repeat(4, 1fr); } }
        @media (max-width: 700px) { .game-grid { grid-template-columns: repeat(2, 1fr); } }

        /* KARTA GIER */
        .game-card {
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(20px); 
            border-radius: 1.2rem;
            overflow: hidden; 
            border: 1px solid var(--glass-border);
            transition: transform 0.3s var(--bezier), opacity 0.3s var(--bezier), border-color 0.3s ease, box-shadow 0.3s ease;
            cursor: grab;
            user-select: none;
        }

        .game-card:active {
            cursor: grabbing;
        }

        /* Styl dla karty podczas przeciągania */
        .game-card.dragging {
            opacity: 0.4;
            transform: scale(0.95);
            border-color: rgba(255, 255, 255, 0.8);
        }

        /* Styl podświetlenia karty nad którą przeciągamy */
        .game-card.drag-over {
            border-color: #3b82f6;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
            transform: scale(1.03);
        }

        /* Klasa wyjścia przy kasowaniu/przenoszeniu */
        .game-card.card-leaving {
            opacity: 0 !important;
            transform: scale(0.82) translateY(12px) !important;
            pointer-events: none;
        }

        .game-card:hover:not(.dragging) { 
            z-index: 10; 
            transform: translateY(-6px) scale(1.05); 
            border-color: rgba(255, 255, 255, 0.5); 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7); 
        }

        .img-box { 
            width: 100%; 
            aspect-ratio: 3 / 4; 
            overflow: hidden; 
            position: relative; 
            background: #000; 
        }
        .img-box img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            pointer-events: none;
        }

        /* Light Sweep Effect */
        .img-box::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -150%;
            width: 60%;
            height: 200%;
            background: linear-gradient(
                90deg,
                transparent 0%,
                rgba(255, 255, 255, 0.35) 50%,
                transparent 100%
            );
            transform: rotate(25deg);
            pointer-events: none;
            z-index: 3;
        }

        @keyframes lightSweepAnimation {
            0% { left: -150%; }
            60% { left: 150%; }
            100% { left: 150%; }
        }

        .game-card:hover .img-box::after {
            animation: lightSweepAnimation 4s ease-in-out 1s infinite;
        }

        .nav-arrow, .action-btn {
            width: 1.8rem; height: 1.8rem; border-radius: 50%;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.15);
            color: white; cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: 0.3s var(--bezier); z-index: 5; font-size: 0.75rem;
        }
        .nav-arrow:hover, .action-btn:hover { background: rgba(255, 255, 255, 0.2); border-color: rgba(255, 255, 255, 0.8); transform: scale(1.1); }

        .gallery-nav { position: absolute; top: 50%; width: 100%; display: flex; justify-content: space-between; padding: 0 0.4rem; transform: translateY(-50%); opacity: 0; transition: 0.3s; z-index: 4; }
        .game-card:hover .gallery-nav { opacity: 1; }
        .card-overlay { position: absolute; bottom: 0.5rem; right: 0.5rem; display: flex; gap: 0.3rem; opacity: 0; transition: 0.3s; z-index: 4; }
        .game-card:hover .card-overlay { opacity: 1; }

        .game-info { padding: 0.8rem; }
        .game-title { font-size: 0.9rem; font-weight: 800; margin-bottom: 0.3rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .platform-badge { font-size: 0.6rem; padding: 0.25rem 0.6rem; border-radius: 0.4rem; font-weight: 800; text-transform: uppercase; color: white; display: inline-block; margin-bottom: 0.4rem; }
        .badge-ps { background: var(--ps-brand); }
        .badge-xbox { background: var(--xbox-brand); }
        .badge-pc { background: #444; }

        .note-input {
            width: 100%;
            margin-top: 0.4rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid transparent;
            border-bottom: 1px solid var(--glass-border);
            color: var(--text-dim);
            padding: 0.3rem;
            font-size: 0.75rem;
            border-radius: 0.3rem 0.3rem 0 0;
            transition: 0.3s var(--bezier);
            outline: none;
        }
        .note-input:focus {
            background: rgba(255, 255, 255, 0.08);
            border-bottom-color: #fff;
            color: #fff;
        }

        .section-header { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 3px; color: var(--text-dim); margin: 0 0 2rem; display: flex; align-items: center; gap: 1.5rem; }
        .section-header::after { content: ""; height: 1px; flex: 1; background: var(--glass-border); }

        .suggestions {
            position: absolute; top: 5rem; left: 0; width: 100%;
            max-height: 400px; overflow-y: auto;
            overscroll-behavior: contain;
            background: #111; border-radius: 1.5rem; display: none;
            flex-direction: column; border: 1px solid var(--glass-border);
            box-shadow: 0 40px 80px rgba(0,0,0,0.9);
            z-index: 3000;
        }
        .sugg-item { display: flex; align-items: center; gap: 1.2rem; padding: 1rem; cursor: pointer; border-bottom: 1px solid var(--glass-border); }
        .sugg-item:hover { background: rgba(255,255,255,0.05); }
        .sugg-item img { width: 3.5rem; aspect-ratio: 3/4; border-radius: 0.5rem; object-fit: cover; }
        .sugg-empty { padding: 1.2rem; color: var(--text-dim); text-align: center; font-size: 0.9rem; }
    </style>
</head>
<body>

    <!-- MODAL PLATFORMY -->
    <div id="platformModal">
        <div class="modal-content">
            <h2 id="modalGameName" style="margin-bottom: 1rem;">Wybierz platformę</h2>
            <div id="platformList" class="platform-list"></div>
            <button onclick="closeModal()" style="background:none; border:none; color:var(--text-dim); cursor:pointer; font-weight:700; margin-top:1rem;">Anuluj</button>
        </div>
    </div>

    <!-- MODAL POTWIERDZENIA USUNIĘCIA -->
    <div id="deleteModal">
        <div class="modal-content">
            <h2 style="margin-bottom: 0.5rem; font-size: 1.3rem;">Czy na pewno usunąć?</h2>
            <div id="deleteGameName" style="color: var(--text-dim); margin-bottom: 1.8rem; font-weight: 600; font-size: 0.95rem;"></div>
            <div style="display: flex; gap: 1rem; justify-content: center;">
                <button class="platform-btn btn-confirm-yes" onclick="executeDelete()" style="padding: 0.8rem 1.8rem;">TAK</button>
                <button class="platform-btn btn-confirm-no" onclick="closeDeleteModal()" style="padding: 0.8rem 1.8rem;">NIE</button>
            </div>
        </div>
    </div>

    <div class="top-bar">
        <div class="logo">
            <i class="fa-solid fa-gamepad"></i> BIBLIOTEKA GIER
            <div class="header-stats">
                <span id="statToPlay">0</span> w kolejce &nbsp;|&nbsp; <span id="statDone">0</span> ukończonych
            </div>
        </div>
        <div class="search-container">
            <div class="search-box">
                <input type="text" id="searchInput" class="search-input" placeholder="Wyszukaj grę..." autocomplete="off">
                <i class="fa-solid fa-circle-notch fa-spin search-loader" id="searchLoader"></i>
            </div>
            <div id="suggestions" class="suggestions"></div>
        </div>
        <div class="tools-container">
            <div class="tooltip-wrap" data-tooltip="Platformy">
                <select id="platformFilter" class="tool-btn" onchange="applyControls()" aria-label="Filtrowanie platformy">
                    <option value="all">Wszystkie platformy</option>
                    <option value="PlayStation">PlayStation</option>
                    <option value="Xbox">Xbox</option>
                    <option value="PC">PC</option>
                </select>
            </div>
            <div class="tooltip-wrap" data-tooltip="Sortowanie">
                <select id="sortFilter" class="tool-btn" onchange="applyControls()" aria-label="Sortowanie">
                    <option value="newest">Najnowsze</option>
                    <option value="az">Alfabetycznie A–Z</option>
                    <option value="za">Alfabetycznie Z–A</option>
                </select>
            </div>
            <div class="tooltip-wrap" data-tooltip="Pobierz">
                <button class="tool-btn" onclick="exportData()"><i class="fa-solid fa-download"></i></button>
            </div>
            <div class="tooltip-wrap" data-tooltip="Wczytaj">
                <label class="tool-btn" style="cursor:pointer;">
                    <i class="fa-solid fa-upload"></i>
                    <input type="file" id="importInput" style="display:none;" onchange="importData(event)">
                </label>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="section-header">Twoja Kolejka</div>
        <div id="toPlayGrid" class="game-grid" data-list-type="toPlay"></div>
        <div class="section-header" style="margin-top: 4rem;">Ukończone Gry</div>
        <div id="completedGrid" class="game-grid" data-list-type="completed"></div>
    </div>

    <script>
        if (history.scrollRestoration) {
            history.scrollRestoration = 'manual';
        }
        window.scrollTo(0, 0);

        window.addEventListener('scroll', () => {
            const topBar = document.querySelector('.top-bar');
            if (window.scrollY > 20) {
                topBar.classList.add('scrolled');
            } else {
                topBar.classList.remove('scrolled');
            }
        });

        const WORKER_URL = 'https://xddd.oliwier16056.workers.dev';

        let state = JSON.parse(localStorage.getItem('gt_v9_liquid')) || { toPlay: [], completed: [] };
        
        let currentSearchData = [];
        let pendingGame = null;
        let pendingDeleteId = null;
        let pendingDeleteList = null;
        let triggerEntranceAnim = true;
        let debounceTimer;

        // Przechowywanie id przeciąganej karty oraz jej kategorii
        let draggedCardId = null;
        let draggedCardType = null;

        const savedSort = localStorage.getItem('gt_v9_sort') || 'newest';
        const savedPlatformFilter = localStorage.getItem('gt_v9_platform_filter') || 'all';
        document.getElementById('sortFilter').value = savedSort;
        document.getElementById('platformFilter').value = savedPlatformFilter;
        
        const saveOnly = () => localStorage.setItem('gt_v9_liquid', JSON.stringify(state));
        
        const optimizeImg = (url) => {
            if (!url) return 'https://via.placeholder.com/600x800?text=Brak+Ok%C5%82adki';
            let formattedUrl = url.startsWith('//') ? `https:${url}` : url;
            return formattedUrl.replace('t_thumb', 't_cover_big').replace('t_720p', 't_cover_big');
        };

        const searchInput = document.getElementById('searchInput');
        const suggBox = document.getElementById('suggestions');
        const loader = document.getElementById('searchLoader');

        searchInput.addEventListener('input', (e) => {
            const val = e.target.value.trim();
            if (val.length < 2) { 
                suggBox.style.display = 'none'; 
                loader.style.display = 'none';
                return; 
            }
            
            loader.style.display = 'block';
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(async () => {
                try {
                    const res = await fetch(WORKER_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain' },
                        body: val
                    });

                    const games = await res.json();
                    currentSearchData = Array.isArray(games) ? games : [];
                    
                    if (currentSearchData.length === 0) {
                        suggBox.innerHTML = `<div class="sugg-empty">Brak wyników wyszukiwania</div>`;
                    } else {
                        suggBox.innerHTML = currentSearchData.map((g, i) => {
                            const imgUrl = g.cover && g.cover.url ? g.cover.url : (g.screenshots && g.screenshots[0] ? g.screenshots[0].url : '');
                            const ratingValue = Number(g.rating ?? g.aggregated_rating);
                            
                            let ratingText = Number.isFinite(ratingValue) && ratingValue > 0
                                ? `⭐ ${Math.round(ratingValue)}/100`
                                : 'Brak oceny';

                            if (g.first_release_date) {
                                const releaseYear = new Date(g.first_release_date * 1000).getFullYear();
                                if (releaseYear) {
                                    ratingText += ` &nbsp;|&nbsp; 📅 ${releaseYear}`;
                                }
                            }

                            return `
                            <div class="sugg-item" onclick="openPlatformModal(${i})">
                                <img src="${optimizeImg(imgUrl)}">
                                <div>
                                    <div style="font-weight:800; font-size:1rem;">${g.name}</div>
                                    <div style="font-size:0.8rem; color:var(--text-dim); margin-top:0.2rem;">${ratingText}</div>
                                </div>
                            </div>`;
                        }).join('');
                    }
                    suggBox.style.display = 'flex';
                } catch (err) { 
                    console.error(err); 
                    suggBox.innerHTML = `<div class="sugg-empty">Błąd pobierania danych z Workera</div>`;
                    suggBox.style.display = 'flex';
                } finally { 
                    loader.style.display = 'none'; 
                }
            }, 300);
        });

        window.openPlatformModal = function(index) {
            const game = currentSearchData[index];
            if (!game) return;
            pendingGame = game;
            document.getElementById('modalGameName').innerText = game.name;
            const pList = document.getElementById('platformList');
            
            const possiblePlatforms = [
                { id: 6, name: "PC", type: "pc" },
                { id: 167, name: "PlayStation 5", type: "ps" },
                { id: 48, name: "PlayStation 4", type: "ps" },
                { id: 169, name: "Xbox Series X/S", type: "xbox" },
                { id: 49, name: "Xbox One", type: "xbox" }
            ];

            const matchedPlatforms = possiblePlatforms;

            pList.innerHTML = matchedPlatforms.map(p => {
                let hCls = 'btn-pc';
                if (p.type === 'ps') hCls = 'btn-ps';
                if (p.type === 'xbox') hCls = 'btn-xbox';
                return `<button class="platform-btn ${hCls}" onclick="confirmAdd('${p.name}')">${p.name}</button>`;
            }).join('');
            
            document.getElementById('platformModal').style.display = 'flex';
            suggBox.style.display = 'none';
        }

        window.closeModal = () => document.getElementById('platformModal').style.display = 'none';

        window.confirmAdd = (platform) => {
            if (!pendingGame) return;
            
            let shots = [];
            if (pendingGame.cover && pendingGame.cover.url) {
                shots.push(pendingGame.cover.url);
            }
            if (Array.isArray(pendingGame.screenshots)) {
                pendingGame.screenshots.forEach(s => {
                    if (s && s.url) shots.push(s.url);
                });
            }
            shots = [...new Set(shots)];

            if (shots.length === 0) {
                shots = ['https://via.placeholder.com/600x800?text=Brak+Ok%C5%82adki'];
            }

            let genres = [];
            if (pendingGame.genres && Array.isArray(pendingGame.genres)) {
                genres = pendingGame.genres.map(g => g.name);
            }

            state.toPlay.push({ 
                id: Math.random().toString(36).substring(2, 11), 
                name: pendingGame.name, 
                screenshots: shots, 
                releaseDate: pendingGame.first_release_date || 0,
                platform: platform, 
                genres: genres,
                note: "" 
            });
            
            saveOnly();
            triggerEntranceAnim = false;
            renderWithTransition(); 
            closeModal(); 
            searchInput.value = '';
        }

        window.changeImg = (gameId, listType, dir, e) => {
            if (e) e.stopPropagation();
            const game = state[listType].find(g => g.id === gameId);
            if (!game || !Array.isArray(game.screenshots) || game.screenshots.length < 2) return;
            game.currentShotIdx = (Number(game.currentShotIdx || 0) + dir + game.screenshots.length) % game.screenshots.length;
            const card = e && e.target ? e.target.closest('.game-card') : null;
            const img = card ? card.querySelector('.main-img') : null;
            if (img) img.src = optimizeImg(game.screenshots[game.currentShotIdx]);
            saveOnly();
        };

        // Pomocnicza funkcja do płynnego wygaszania karty przed zmianą w stanie
        function animateCardExit(cardId, callback) {
            const cardEl = document.querySelector(`[data-id="${cardId}"]`);
            if (cardEl) {
                cardEl.classList.add('card-leaving');
                setTimeout(() => {
                    renderWithTransition(callback);
                }, 220); // Dyskretne opóźnienie 220ms dla płynnego animowania
            } else {
                renderWithTransition(callback);
            }
        }

        // Pomocnicza funkcja dla View Transitions API (gładkie przesuwanie reszty kart)
        function renderWithTransition(callback) {
            if (callback) callback();
            if (document.startViewTransition) {
                document.startViewTransition(() => {
                    render();
                });
            } else {
                render();
            }
        }

        // Przenoszenie do ukończonych
        window.moveToDone = (id, e) => {
            if (e) e.stopPropagation();
            animateCardExit(id, () => {
                const idx = state.toPlay.findIndex(g => g.id === id);
                if (idx !== -1) {
                    const game = state.toPlay.splice(idx, 1)[0];
                    game.toPlayIndex = idx;
                    state.completed.push(game);
                    saveOnly();
                    triggerEntranceAnim = false;
                }
            });
        };

        // Przenoszenie z ukończonych do kolejki
        window.moveToToPlay = (id, e) => {
            if (e) e.stopPropagation();
            animateCardExit(id, () => {
                const idx = state.completed.findIndex(g => g.id === id);
                if (idx !== -1) {
                    const game = state.completed.splice(idx, 1)[0];
                    const restoreIdx = (typeof game.toPlayIndex === 'number' && game.toPlayIndex <= state.toPlay.length)
                        ? game.toPlayIndex
                        : state.toPlay.length;
                    state.toPlay.splice(restoreIdx, 0, game);
                    saveOnly();
                    triggerEntranceAnim = false;
                }
            });
        };

        // Wywołanie modala usuwania
        window.removeGame = (id, list, e) => {
            if (e) e.stopPropagation();
            pendingDeleteId = id;
            pendingDeleteList = list;
            const game = state[list].find(g => g.id === id);
            if (!game) return;

            document.getElementById('deleteGameName').innerText = game.name;
            document.getElementById('deleteModal').style.display = 'flex';
        };

        window.closeDeleteModal = () => {
            document.getElementById('deleteModal').style.display = 'none';
            pendingDeleteId = null;
            pendingDeleteList = null;
        };

        window.executeDelete = () => {
            if (pendingDeleteId && pendingDeleteList) {
                const delId = pendingDeleteId;
                const delList = pendingDeleteList;
                closeDeleteModal();
                
                animateCardExit(delId, () => {
                    state[delList] = state[delList].filter(g => g.id !== delId);
                    saveOnly();
                    triggerEntranceAnim = false;
                });
            } else {
                closeDeleteModal();
            }
        };

        window.saveGameNote = (id, list, inputEl) => {
            const game = state[list].find(g => g.id === id);
            if(game) {
                game.note = inputEl.value;
                saveOnly();
            }
        };

        function sortGames(list) {
            const sortValue = document.getElementById('sortFilter').value;
            const copy = [...list];

            if (sortValue === 'az') {
                return copy.sort((a, b) => a.name.localeCompare(b.name, 'pl', { sensitivity: 'base' }));
            }
            if (sortValue === 'za') {
                return copy.sort((a, b) => b.name.localeCompare(a.name, 'pl', { sensitivity: 'base' }));
            }
            return copy;
        }

        // FX Drag and Drop
        function handleDragStart(e) {
            draggedCardId = this.getAttribute('data-id');
            draggedCardType = this.getAttribute('data-type');
            this.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', draggedCardId);
        }

        function handleDragEnd(e) {
            this.classList.remove('dragging');
            document.querySelectorAll('.game-card').forEach(card => card.classList.remove('drag-over'));
            draggedCardId = null;
            draggedCardType = null;
        }

        function handleDragOver(e) {
            e.preventDefault();
            const targetType = this.getAttribute('data-type');
            if (draggedCardType === targetType && draggedCardId !== this.getAttribute('data-id')) {
                e.dataTransfer.dropEffect = 'move';
                this.classList.add('drag-over');
            } else {
                e.dataTransfer.dropEffect = 'none';
            }
        }

        function handleDragLeave(e) {
            this.classList.remove('drag-over');
        }

        function handleDrop(e) {
            e.preventDefault();
            this.classList.remove('drag-over');

            const targetId = this.getAttribute('data-id');
            const targetType = this.getAttribute('data-type');

            if (!draggedCardId || draggedCardType !== targetType || draggedCardId === targetId) {
                return;
            }

            const list = state[targetType];
            const draggedIdx = list.findIndex(g => g.id === draggedCardId);
            const targetIdx = list.findIndex(g => g.id === targetId);

            if (draggedIdx !== -1 && targetIdx !== -1) {
                const [movedItem] = list.splice(draggedIdx, 1);
                list.splice(targetIdx, 0, movedItem);
                saveOnly();
                triggerEntranceAnim = false;
                renderWithTransition();
            }
        }

        function renderGrid(elementId, list, type) {
            const platformFilter = document.getElementById('platformFilter').value;
            const filtered = sortGames(list.filter(g =>
                platformFilter === 'all' || String(g.platform || '').includes(platformFilter)
            ));

            const container = document.getElementById(elementId);
            container.innerHTML = filtered.map((g, index) => {
                const pCls = String(g.platform || '').includes('PlayStation')
                    ? 'badge-ps'
                    : (String(g.platform || '').includes('Xbox') ? 'badge-xbox' : 'badge-pc');

                const imageUrl = Array.isArray(g.screenshots) && g.screenshots.length
                    ? g.screenshots[g.currentShotIdx || 0]
                    : 'https://via.placeholder.com/600x800?text=Brak+Ok%C5%82adki';

                const animStyle = triggerEntranceAnim 
                    ? `animation: staggeredCardEntrance 0.45s var(--bezier) backwards; animation-delay: ${index * 0.04}s;` 
                    : `animation: none;`;

                return `
                <div class="game-card" data-id="${g.id}" data-type="${type}" draggable="true" style="view-transition-name: card-${g.id}; ${animStyle}">
                    <div class="img-box">
                        <img src="${optimizeImg(imageUrl)}" class="main-img" alt="${g.name}" loading="lazy">
                        ${Array.isArray(g.screenshots) && g.screenshots.length > 1 ? `
                        <div class="gallery-nav">
                            <button class="nav-arrow" onclick="changeImg('${g.id}', '${type}', -1, event)" aria-label="Poprzednie zdjęcie"><i class="fa-solid fa-chevron-left"></i></button>
                            <button class="nav-arrow" onclick="changeImg('${g.id}', '${type}', 1, event)" aria-label="Następne zdjęcie"><i class="fa-solid fa-chevron-right"></i></button>
                        </div>` : ''}
                        <div class="card-overlay">
                            ${type === 'toPlay'
                                ? `<button class="action-btn" onclick="moveToDone('${g.id}', event)"><i class="fa-solid fa-check" style="color:#10b981"></i></button>`
                                : `<button class="action-btn" onclick="moveToToPlay('${g.id}', event)"><i class="fa-solid fa-rotate-left"></i></button>`}
                            <button class="action-btn" onclick="removeGame('${g.id}', '${type}', event)"><i class="fa-solid fa-trash-can" style="color:#ef4444"></i></button>
                        </div>
                    </div>
                    <div class="game-info">
                        <div class="platform-badge ${pCls}">${g.platform}</div>
                        <div class="game-title">${g.name}</div>
                        <input type="text" class="note-input" placeholder="" value="${String(g.note || '').replace(/"/g, '&quot;')}" onchange="saveGameNote('${g.id}', '${type}', this)" onmousedown="event.stopPropagation()">
                    </div>
                </div>`;
            }).join('');

            // Podpinanie eventów drag & drop dla wyrenderowanych kart
            const cards = container.querySelectorAll('.game-card');
            cards.forEach(card => {
                card.addEventListener('dragstart', handleDragStart);
                card.addEventListener('dragend', handleDragEnd);
                card.addEventListener('dragover', handleDragOver);
                card.addEventListener('dragleave', handleDragLeave);
                card.addEventListener('drop', handleDrop);
            });
        }

        function applyControls() {
            const sortValue = document.getElementById('sortFilter').value;
            const platformValue = document.getElementById('platformFilter').value;
            localStorage.setItem('gt_v9_sort', sortValue);
            localStorage.setItem('gt_v9_platform_filter', platformValue);
            triggerEntranceAnim = true;
            render();
        }

        function render() { 
            const platformFilter = document.getElementById('platformFilter').value;
            
            // Filtrowanie wyliczeń dla widocznych gier (dynamiczne statystyki)
            const visibleToPlay = state.toPlay.filter(g =>
                platformFilter === 'all' || String(g.platform || '').includes(platformFilter)
            ).length;

            const visibleCompleted = state.completed.filter(g =>
                platformFilter === 'all' || String(g.platform || '').includes(platformFilter)
            ).length;

            document.getElementById('statToPlay').innerText = visibleToPlay;
            document.getElementById('statDone').innerText = visibleCompleted;

            renderGrid('toPlayGrid', state.toPlay, 'toPlay'); 
            renderGrid('completedGrid', state.completed, 'completed'); 

            triggerEntranceAnim = false;
        }

        window.exportData = () => { 
            const dateStr = new Date().toISOString().split('T')[0];
            const blob = new Blob([JSON.stringify(state)], {type: "application/json"}); 
            const url = URL.createObjectURL(blob); 
            const a = document.createElement('a'); 
            a.href = url; 
            a.download = `biblioteka_${dateStr}.json`; 
            a.click(); 
        };
        
        window.importData = (e) => { 
            const reader = new FileReader(); 
            reader.onload = (ev) => { 
                state = JSON.parse(ev.target.result);
                state.toPlay = Array.isArray(state.toPlay) ? state.toPlay : [];
                state.completed = Array.isArray(state.completed) ? state.completed : [];
                [...state.toPlay, ...state.completed].forEach(g => {
                    if (typeof g.releaseDate === 'undefined') g.releaseDate = 0;
                    if (typeof g.currentShotIdx !== 'number') g.currentShotIdx = 0;
                    if (!Array.isArray(g.screenshots) || g.screenshots.length === 0) {
                        g.screenshots = ['https://via.placeholder.com/600x800?text=Brak+Ok%C5%82adki'];
                    }
                    if (g.currentShotIdx >= g.screenshots.length) g.currentShotIdx = 0;
                });
                saveOnly(); 
                triggerEntranceAnim = true;
                render(); 
            }; 
            reader.readAsText(e.target.files[0]); 
        };
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
                closeDeleteModal();
                suggBox.style.display = 'none';
            }
        });

        window.onclick = (e) => { if (!e.target.closest('.search-container')) suggBox.style.display = 'none'; };
        render();
    </script>
</body>
</html>
